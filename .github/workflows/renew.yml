name: Auto Renew Host-ship

on:
  schedule:
    # 每天跑一次（UTC 07:00 = 北京 15:00）
    # 2026-10-21 起面板总上限收紧到 14 天，可续窗口只在「剩余 < 14 天」时出现且很窄，
    # 每 10 天跑一次会错过窗口（剩 20 天时必被 400 拒），改成每天跑。
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  Renew-hostship:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write # keepalive 空提交需要

    steps:
      - uses: actions/checkout@v6

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛠️ 安装依赖
        run: pip install requests

      - name: 🚀 运行续期脚本（纯 HTTP，无浏览器）
        env:
          API_KEY: ${{ secrets.API_KEY }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          COOKIE: ${{ secrets.COOKIE }}
          EMAIL: ${{ secrets.EMAIL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 app.py

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: 🔁 Keepalive（防止 60 天无仓库活动导致 schedule 被停用）
        if: always()
        run: |
          # GitHub 规则：公开仓库 60 天无 commit/PR/issue 活动会自动停用 schedule，
          # 而定时运行本身不算活动。距上次提交 ≥50 天时打一个空提交续命。
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "距上次提交 ${days} 天"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive（重置 scheduled workflow 60 天计时）"
            git push
          else
            echo "仓库近期有活动，无需 keepalive"
          fi
